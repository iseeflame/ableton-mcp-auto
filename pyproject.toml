[project]
name = "ableton-mcp-auto"
version = "1.2.0"
description = "Ableton Live integration through the Model Context Protocol, with mixing and automation control"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Mark Streletsky", email = "iseeflame333@gmail.com"},
    {name = "Siddharth Ahuja", email = "ahujasid@gmail.com"}
]
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp[cli]>=1.3.0",
]

[project.scripts]
ableton-mcp-auto = "MCP_Server.server:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["MCP_Server"]

[project.urls]
"Homepage" = "https://github.com/iseeflame/ableton-mcp-auto"
"Upstream" = "https://github.com/ahujasid/ableton-mcp"
"Bug Tracker" = "https://github.com/iseeflame/ableton-mcp-auto/issues"